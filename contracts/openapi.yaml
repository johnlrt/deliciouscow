            }
          },
          "earnings_pending_piconero": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Money"
              },
              {
                "type": "null"
              }
            ],
            "description": "Null until M3 node-level earnings are available."
          },
          "earnings_available_piconero": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Money"
              },
              {
