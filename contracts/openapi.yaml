            "maxLength": 64
          },
          "status": {
            "type": "string",
            "enum": [
              "enrolling",
              "benchmarking",
              "online",
              "busy",
              "warming",
              "offline",
              "draining",
              "quarantined"
            ]
          },
          "rank": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 100,
            "description": "Null until the M4A rank projection has produced a verified score."
          },
          "rank_updated_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time",
            "description": "Null until a rank score exists."
          },
          "hardware": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Hardware"
              },
              {
                "type": "null"
              }
