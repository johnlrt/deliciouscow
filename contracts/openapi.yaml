          "Retry-After": {
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ExecutorUnavailable": {
        "description": "The mock executor failed or exceeded its deadline.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "Health": {
        "type": "object",
        "required": [
          "status",
          "stage",
          "mode"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "ok"
          },
          "stage": {
            "type": "string",
            "enum": [
              "1",
              "m1"
            ]
          },
          "mode": {
            "type": "string",
            "const": "mock"
          }
        },
        "additionalProperties": false
      },
      "Message": {
        "type": "object",
        "required": [
          "role",
          "content"
        ],
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "system",
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "string",
            "maxLength": 262144,
            "x-max-utf8-bytes": 262144
          }
        },
        "additionalProperties": false
      },
      "StreamOptions": {
        "type": "object",
        "required": [
          "include_usage"
        ],
        "properties": {
          "include_usage": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "ChatCompletionRequest": {
        "type": "object",
        "required": [
          "model",
          "messages"
        ],
        "properties": {
          "model": {
            "type": "string",
            "minLength": 1
          },
          "messages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 128,
            "items": {
              "$ref": "#/components/schemas/Message"
            },
            "contains": {
              "type": "object",
              "required": [
                "role"
              ],
              "properties": {
                "role": {
                  "const": "user"
                }
              }
            },
            "minContains": 1
          },
          "max_tokens": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2048,
            "default": 512
          },
          "stream": {
            "type": "boolean",
            "default": false
          },
          "stream_options": {
            "$ref": "#/components/schemas/StreamOptions"
          },
          "temperature": {
            "type": "number",
            "minimum": 0,
            "maximum": 2,
            "default": 0.7
          },
          "top_p": {
            "type": "number",
            "exclusiveMinimum": 0,
            "maximum": 1,
            "default": 0.95
          },
          "stop": {
            "oneOf": [
              {
                "type": "string",
                "maxLength": 128
              },
              {
                "type": "array",
                "maxItems": 4,
                "items": {
                  "type": "string",
                  "maxLength": 128
                }
              }
            ]
          },
          "seed": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          },
          "n": {
            "type": "integer",
            "const": 1,
            "default": 1
          },
          "user": {
            "type": "string",
            "description": "Accepted for client compatibility, then discarded by the gateway."
          }
        },
        "allOf": [
          {
            "if": {
              "required": [
                "stream_options"
              ]
            },
            "then": {
              "properties": {
                "stream": {
                  "const": true
                }
              }
            }
          }
        ],
        "additionalProperties": false,
        "x-stage-2-expansion": "Implements validation and provider forwarding for PLAN.md C2 generation controls. Context-window enforcement, real tokenization and actual sampling remain unavailable until the tokenizer and model path are admitted."
      },
      "Usage": {
        "type": "object",
        "required": [
          "prompt_tokens",
          "completion_tokens",
          "total_tokens"
        ],
        "properties": {
          "prompt_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "completion_tokens": {
            "type": "integer",
            "minimum": 0
          },
          "total_tokens": {
            "type": "integer",
            "minimum": 0
          }
        },
        "additionalProperties": false,
        "description": "Synthetic word counts in stage 1; not tokenizer output or billable usage."
      },
      "ChatCompletion": {
        "type": "object",
        "required": [
          "id",
          "object",
          "created",
          "model",
          "choices",
          "usage"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^chatcmpl-[0-9a-f-]{36}$"
          },
          "object": {
            "type": "string",
            "const": "chat.completion"
          },
          "created": {
            "type": "integer",
            "minimum": 0
          },
          "model": {
            "type": "string"
          },
          "choices": {
            "type": "array",
            "minItems": 1,
            "maxItems": 1,
            "items": {
              "type": "object",
              "required": [
                "index",
                "message",
                "finish_reason"
              ],
              "properties": {
                "index": {
                  "type": "integer",
                  "const": 0
                },
                "message": {
                  "$ref": "#/components/schemas/AssistantMessage"
                },
