            "type": "integer",
            "minimum": 0
          },
          "reported_free_vram_bytes": {
            "type": "integer",
            "minimum": 0
          },
          "ram_bytes": {
            "type": "integer",
            "minimum": 1
          }
        },
        "additionalProperties": false
      },
