            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "description": "Null until a server-side benchmark records throughput."
          },
          "latency_ms": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "uptime_ratio": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 1,
            "description": "Null until a sufficiently sampled reliability window exists."
          },
          "success_ratio": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 1,
            "description": "Null until a sufficiently sampled request window exists."
          },
          "last_seen_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "models": {
            "type": "array",
            "items": {
