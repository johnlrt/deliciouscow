services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/headers.conf:/etc/nginx/headers.conf:ro
      - ../.local/certs:/etc/nginx/certs:ro
    depends_on:
      - server
    networks:
      - edge

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    environment:
      ADDR: ":8080"
      METRICS_ADDR: ":9090"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      TOKENIZER_URL: "http://tokenizer:8090"
      TOKENIZER_SECRET: "${TOKENIZER_SECRET:-dev-tokenizer-secret}"
      MONERO_NETWORK: "${MONERO_NETWORK:-stagenet}"
      DEV_MODE: "${DEV_MODE:-0}"
      DEV_INSECURE_COOKIES: "${DEV_INSECURE_COOKIES:-0}"
      STATIC_DIR: "/app/frontend-build"
    depends_on:
      - redis
      - kafka
      - tokenizer
    networks:
      - edge
      - tokenization
      - data
      - events
      - ops

  tokenizer:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    command: ["/app/cordova-tokenizer"]
    environment:
      ADDR: ":8090"
      TOKENIZER_SECRET: "${TOKENIZER_SECRET:-dev-tokenizer-secret}"
      CATALOG_VERSION: "v1-m1"
    networks:
      - tokenization

  payments:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    command: ["/app/cordova-payments"]
    environment:
      REDIS_ADDR: "redis:6379"
      MONERO_WALLET_RPC: "http://monero-wallet-rpc:18082"
      MONERO_NETWORK: "${MONERO_NETWORK:-stagenet}"
    depends_on:
      - redis
      - monero-wallet-rpc
    networks:
      - data
      - wallet-rpc

  ranker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    command: ["/app/cordova-ranker"]
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - data
      - events

  event-publisher:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    command: ["/app/cordova-event-publisher"]
    environment:
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      - redis
      - kafka
    networks:
      - data
      - events

  projections:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    command: ["/app/cordova-projections"]
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - data
      - events

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - data

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - events

  monero-wallet-rpc:
    image: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:latest
    command:
      - "--stagenet"
      - "--daemon-address=monerod:18081"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18082"
      - "--confirm-external-bind"
      - "--disable-rpc-login"
      - "--wallet-dir=/wallet"
    depends_on:
      - monerod
    volumes:
      - monero_wallet:/wallet
    networks:
      - wallet-rpc
      - chain-rpc

  monerod:
    image: ghcr.io/sethforprivacy/simple-monerod:latest
    command:
      - "--stagenet"
      - "--rpc-restricted-bind-ip=0.0.0.0"
      - "--rpc-restricted-bind-port=18081"
      - "--confirm-external-bind"
      - "--no-igd"
    volumes:
      - monero_chain:/home/monero/.bitmonero
    networks:
      - chain-rpc

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - ops

networks:
  edge:
  tokenization:
    internal: true
  data:
    internal: true
  events:
    internal: true
  wallet-rpc:
    internal: true
  chain-rpc:
    internal: true
  ops:
    internal: true

volumes:
  redis_data:
  kafka_data:
  monero_wallet:
  monero_chain:
